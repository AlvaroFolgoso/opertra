<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Opertra">
  <title>Opertra</title>
  <desc>Placa de maquinaria con cuatro remaches y el anillo partido de Opertra</desc>

  <defs>
    <linearGradient id="op-placa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBB114"/>
      <stop offset="1" stop-color="#EF9800"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" fill="#1C2126"/>

  <!-- La placa -->
  <rect x="26.5" y="26.5" width="75" height="75" rx="10" fill="url(#op-placa)"/>

  <!-- El anillo, partido por una diagonal -->
  <path fill="#1C2126" fill-rule="evenodd"
        d="M55 39 h18 a16 16 0 0 1 16 16 v18 a16 16 0 0 1 -16 16 h-18 a16 16 0 0 1 -16 -16 v-18 a16 16 0 0 1 16 -16 z
           M58.5 51.5 h11 a7 7 0 0 1 7 7 v11 a7 7 0 0 1 -7 7 h-11 a7 7 0 0 1 -7 -7 v-11 a7 7 0 0 1 7 -7 z"/>

  <!-- El corte: dos tramos en diagonal que parten el anillo en dos piezas
       iguales. No cruzan el cuadrado del centro: van del borde interior
       al exterior, como una compuerta a medio girar. -->
  <g transform="rotate(-45 64 64)" fill="url(#op-placa)">
    <rect x="33" y="61.9" width="18" height="4.2"/>
    <rect x="77" y="61.9" width="18" height="4.2"/>
  </g>

  <!-- Remaches -->
  <g fill="#1C2126">
    <circle cx="34" cy="34" r="2.8"/>
    <circle cx="94" cy="34" r="2.8"/>
    <circle cx="34" cy="94" r="2.8"/>
    <circle cx="94" cy="94" r="2.8"/>
  </g>
</svg>
